[package]
name = "declutter-diff"
version = "0.1.2"
edition = "2024"
rust-version = "1.90"
description = "Review AI-generated diffs with comments, tests, imports, logging and formatting toggled in and out"
license = "MIT"
repository = "https://github.com/NikolajMosbaek/declutter-diff"
homepage = "https://github.com/NikolajMosbaek/declutter-diff"
readme = "README.md"
keywords = ["diff", "code-review", "tree-sitter", "tui", "git"]
categories = ["command-line-utilities", "development-tools"]
# The pictures live on GitHub; the README points there, so the package stays small.
exclude = ["docs/", ".github/"]

# The crate is published as `declutter-diff` (the name `declutter` is taken), but the
# command and the library keep the short name.
# Where cargo-binstall finds the ready-made binaries that each GitHub release carries.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.xz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[lib]
name = "declutter"
path = "src/lib.rs"

[[bin]]
name = "declutter"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
tree-sitter = "0.27.0"
tree-sitter-go = "0.25"
tree-sitter-highlight = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24"
tree-sitter-swift = "0.7.4"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
